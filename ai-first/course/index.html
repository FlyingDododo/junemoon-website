<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/assets/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>AI 上手课</title>
<style>
/* 布局：顶部细条 + 全宽舞台。视觉沿用 catfish 猫鱼说：纸白、墨黑、一个鲇鱼橙，圆窗抖动标本。对错靠形状和填充区分：墨色实心 = 对，橙色实心 = 错。 */
:root{
  --paper:#ECE9E2;--paper2:#F4F2EC;--ink:#161616;--ink2:#4C4A46;--ink3:#6B6863;--line:#C9C5BC;--acc:#D9542B;--acct:#AE3D17;--onacc:#FFFFFF;
  --term:#161616;--termink:#ECE9E2;--termdim:#9A968F;
  --sans:"CF Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"CF Mono","Cascadia Mono",ui-monospace,Consolas,"CF Sans","Microsoft YaHei",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161616;--paper2:#201F1D;--ink:#ECE9E2;--ink2:#C4C0B8;--ink3:#A09C95;--line:#3B3936;--acc:#E8683F;--acct:#F08A66;--onacc:#161616;--term:#0C0C0C;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161616;--paper2:#201F1D;--ink:#ECE9E2;--ink2:#C4C0B8;--ink3:#A09C95;--line:#3B3936;--acc:#E8683F;--acct:#F08A66;--onacc:#161616;--term:#0C0C0C;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:18px;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.7;min-height:100vh}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.22;font-weight:800;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acct)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.acc{color:var(--acc)}
.small{font-size:.86rem;color:var(--ink3)}
.src{font-size:.82rem;color:var(--ink3)}

/* 顶条 */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);display:flex;align-items:center;gap:1rem;min-height:3.2rem;padding-block:.35rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;color:var(--ink2);white-space:nowrap;text-align:left;min-height:44px}
.brand b{font-weight:600;color:var(--ink);font-family:var(--sans);letter-spacing:.04em}
#ticks{flex:1;display:flex;gap:3px;align-items:center;min-width:0}
#ticks button{flex:1;height:44px;position:relative;min-width:0}
#ticks button::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--line);transition:height .2s var(--ease),margin .2s var(--ease),background .2s}
#ticks button.done::after{background:var(--ink)}
#ticks button.cur::after{background:var(--acc);height:10px;margin-top:-5px}
#ticks button:hover::after{height:14px;margin-top:-7px}
.tbtn{min-height:44px;min-width:44px;padding:0 .55rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.tbtn:hover{color:var(--acc)}
.tbtn[aria-pressed="false"]{text-decoration:line-through;color:var(--ink3)}

/* 目录抽屉 */
#drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(10,10,10,.45)}
#drawer>div{width:min(30rem,100%);background:var(--paper);height:100%;overflow-y:auto;padding-block:max(1rem,env(safe-area-inset-top,0px)) 3rem;padding-inline:1.25rem;animation:slidein .28s var(--ease)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.drmod{margin:1.3rem 0 .2rem;display:flex;gap:.6rem;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:.25rem}
.drmod b{font-size:1rem}
.dritem{display:grid;grid-template-columns:2.2rem 2.2rem minmax(0,1fr);gap:.55rem;align-items:center;width:100%;text-align:left;min-height:50px;padding:.2rem 0;border-bottom:1px solid var(--line)}
.dritem:hover{color:var(--acc)}
.dritem .no{font-family:var(--mono);font-size:.78rem;color:var(--ink3)}
.dritem.cur{font-weight:700}
.dritem canvas{width:2.2rem;height:2.2rem;display:block}

/* 主舞台 */
#main{padding-block:0 6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:66rem;margin-inline:auto;display:grid;gap:2.6rem;min-width:0}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:center;padding-top:1.5rem}
.lhead h1{font-size:clamp(2.1rem,5vw,3.4rem);margin:.4rem 0 .5rem}
.lhead .goal{font-size:1.2rem;color:var(--ink2);max-width:40rem}
.lhead canvas{width:clamp(6rem,14vw,10rem);height:clamp(6rem,14vw,10rem);display:block}
.metarow{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;align-items:center}
.sec{display:grid;gap:1.1rem;min-width:0}
.sec>h2{font-size:1.65rem}
.sec>.note{color:var(--ink2);max-width:44rem;margin-top:-.6rem}
.rule{border-top:1px solid var(--ink);padding-top:.6rem}
.panel{background:var(--paper2);border:1px solid var(--line);padding:1.25rem;min-width:0;display:grid;gap:1rem}
.pblock{border:1.5px solid var(--ink);padding:1.1rem 1.25rem;display:grid;gap:.5rem}
.pblock dl{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:.35rem .8rem;margin:0}
.pblock dt{font-family:var(--mono);font-size:.8rem;color:var(--ink3);padding-top:.15rem}
.pblock dd{margin:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.grow{flex:1;min-width:9rem}

/* 按钮 */
.btn{min-height:50px;padding:.5rem 1.4rem;background:var(--ink);color:var(--paper);font-weight:700;border:1.5px solid var(--ink);transition:transform .15s var(--ease),background .15s,color .15s}
.btn:hover{background:var(--acc);border-color:var(--acc);color:var(--onacc);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{min-height:44px;padding:.3rem .9rem;border:1.5px solid var(--line);background:transparent;transition:all .15s var(--ease);line-height:1.35}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

/* 表单 */
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--paper2);border:1.5px solid var(--line);padding:.6rem .8rem;min-height:50px;border-radius:0}
textarea:focus,input:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:7rem;resize:vertical;line-height:1.65}
label{display:grid;gap:.25rem;font-weight:600;font-size:.95rem;min-width:0}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--acc);margin-top:-13px;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--paper)}
.tog{display:flex;gap:.8rem;align-items:flex-start;min-height:48px;padding:.5rem .1rem;font-weight:400;cursor:pointer;border-bottom:1px solid var(--line);grid-template-columns:none}
.tog input{appearance:none;-webkit-appearance:none;flex:none;width:1.6rem;height:1.6rem;border:1.5px solid var(--ink);margin:.1rem 0 0;display:grid;place-items:center;cursor:pointer;background:transparent}
.tog input:checked{background:var(--ink)}
.tog input:checked::after{content:"✓";color:var(--paper);font-size:1rem;line-height:1;font-weight:700}

/* 反馈 */
.fb{padding:.7rem 1rem;border-left:5px solid var(--ink);background:var(--paper2);animation:rise .3s var(--ease)}
.fb b{margin-right:.45rem}
.fb.bad{border-color:var(--acc)}.fb.bad b{color:var(--acct)}
.fb.warn{border-left-style:double;border-left-width:6px}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.shake{animation:shake .32s linear}
.chk{display:flex;gap:.6rem;align-items:center;padding:.3rem 0;color:var(--ink3);transition:color .2s}
.chk i{flex:none;width:1.4rem;height:1.4rem;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700;transition:all .2s var(--ease)}
.chk.on{color:var(--ink)}.chk.on i{background:var(--ink);border-color:var(--ink);color:var(--paper);transform:scale(1.08)}

/* 卡片题 */
.deck{display:grid;gap:1rem;min-width:0}
.dticks{display:flex;gap:3px}
.dticks i{flex:1;height:6px;background:var(--line);transition:background .2s}
.dticks i.r{background:var(--ink)}.dticks i.w{background:var(--acc)}.dticks i.c{box-shadow:0 0 0 1.5px var(--ink)}
.dcard{border:1.5px solid var(--ink);background:var(--paper2);padding:clamp(1.1rem,3vw,2rem);display:grid;gap:1.1rem;animation:cardin .32s var(--ease);min-width:0}
@keyframes cardin{from{transform:translateX(24px) rotate(.6deg);opacity:0}}
.dq{font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:700;line-height:1.4}
.dopts{display:grid;gap:.55rem}
.dopts.inl{grid-template-columns:repeat(auto-fit,minmax(8rem,1fr))}
.dopt{min-height:54px;text-align:left;padding:.55rem 1rem;border:1.5px solid var(--line);line-height:1.45;display:flex;gap:.7rem;align-items:center;transition:all .15s var(--ease)}
.dopt:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.dopt kbd{font-family:var(--mono);font-size:.74rem;color:var(--ink3);flex:none}
.dopt:disabled{cursor:default}
.dopt.r{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}.dopt.r kbd{color:inherit}
.dopt.w{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.dopt.w kbd{color:inherit}
.dsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.3rem;align-items:center}
.dsum .big{font-family:var(--mono);font-size:clamp(3rem,9vw,5rem);line-height:1;font-weight:600}
.drev{display:grid;gap:0}
.drev div{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.4rem;border-top:1px solid var(--line);padding:.45rem 0;font-size:.92rem}

/* 分拣台 */
.sorter{display:grid;gap:1rem;min-width:0;touch-action:pan-y}
.sstage{position:relative;min-height:8.5rem;display:grid;place-items:center;padding:.5rem}
.scard{width:min(36rem,100%);border:1.5px solid var(--ink);background:var(--paper2);padding:1.5rem 1.6rem;font-size:clamp(1.25rem,3vw,1.7rem);font-weight:700;text-align:center;line-height:1.35;cursor:grab;user-select:none;touch-action:none;position:relative;z-index:3;box-shadow:6px 6px 0 var(--ink)}
.scard.drag{cursor:grabbing;box-shadow:12px 12px 0 var(--ink);rotate:-1.5deg}
.scard small{display:block;font-size:.72rem;font-weight:400;font-family:var(--mono);color:var(--ink3);letter-spacing:.1em;margin-bottom:.4rem}
.sbins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.sbin{border:1.5px solid var(--ink);padding:.8rem .6rem;display:grid;justify-items:center;gap:.25rem;text-align:center;min-height:9.5rem;transition:all .15s var(--ease);position:relative;align-content:start}
.sbin canvas{width:4.2rem;height:4.2rem}
.sbin b{font-size:1.15rem}
.sbin span{font-size:.8rem;color:var(--ink2);line-height:1.4}
.sbin:hover,.sbin.over{background:var(--ink);color:var(--paper);transform:translateY(-3px)}
.sbin:hover span,.sbin.over span{color:var(--paper)}
.sbin .cnt{position:absolute;top:.35rem;right:.55rem;font-family:var(--mono);font-size:.8rem}
.sorter.fbk .sbin{pointer-events:none}
.sbin.ans{background:var(--ink);color:var(--paper)}.sbin.ans span{color:var(--paper)}
.sbin.bad{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.sbin.bad span{color:var(--onacc)}
.sbin.hit{animation:binhit .4s var(--ease)}
.sbin.miss{animation:binmiss .4s var(--ease)}
@keyframes binhit{40%{transform:scale(1.04);background:var(--ink);color:var(--paper)}}
@keyframes binmiss{40%{background:var(--acc);color:var(--onacc)}}
.tree2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}

/* 下一个词 */
.nw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.3rem}
.nwsent{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;line-height:1.4;min-height:5.2rem}
.nwsent em{font-style:normal;color:var(--acc);border-bottom:3px solid var(--acc)}
.caret{display:inline-block;width:.55em;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.nwbar{display:grid;grid-template-columns:5.6rem minmax(0,1fr) 3rem;gap:.5rem;align-items:center;font-size:.95rem;min-height:2.1rem}
.nwbar .tr{height:1.3rem;background:var(--line);position:relative}
.nwbar .tr i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .25s var(--ease)}
.nwbar.pick .tr i{background:var(--acc)}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;height:9rem;align-items:end;border-bottom:2px solid var(--ink)}
.bins>div{display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:flex-start;gap:2px;height:100%;width:3.6rem;max-width:100%;margin-inline:auto}
.bins i{width:.62rem;height:.62rem;background:var(--ink);border-radius:50%;animation:drop .3s cubic-bezier(.3,1.4,.6,1)}
.bins i.first{background:var(--acc)}
@keyframes drop{from{transform:translateY(-3rem);opacity:0}}
.binsl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;text-align:center;font-size:.8rem;font-family:var(--mono)}

/* 终端 */
.termgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.8rem}
.term{background:var(--term);color:var(--termink);padding:1rem 1.1rem;font-family:var(--mono);font-size:.92rem;min-width:0;display:flex;flex-direction:column;min-height:20rem}
.termlog{flex:1;max-height:17rem;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.termlog .dim{color:var(--termdim)}.termlog .ok{color:#E8683F}
.termin{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;border-top:1px solid #444;padding-top:.45rem}
.termin input{flex:1;min-width:0;background:transparent;border:0;color:var(--termink);min-height:44px;padding:.2rem;font-family:var(--mono)}
.termin input:focus{outline:none}
.ftree{border:1.5px solid var(--ink);padding:.9rem 1rem;font-family:var(--mono);font-size:.88rem;line-height:1.5;display:grid;gap:.1rem;align-content:start;min-width:0;word-break:break-all}
.ftree div{padding:.15rem .4rem;transition:background .2s;animation:rise .25s var(--ease)}
.ftree .here{background:var(--ink);color:var(--paper)}
.ftree .read{background:var(--acc);color:var(--onacc)}
.ftree .d1{padding-left:1.6rem}

/* 信息量 */
.ctxp mark{background:var(--acc);color:var(--onacc);padding:0 .2em}
.ctxstops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;font-size:.8rem;text-align:center;color:var(--ink3)}
.ctxstops button{min-height:44px;line-height:1.3}
.ctxstops .on{color:var(--ink);font-weight:700}
.ctxmeter{display:flex;gap:3px}
.ctxmeter i{flex:1;height:8px;background:var(--line);transition:background .25s}
.ctxmeter i.on{background:var(--acc)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}

/* 文书红笔 */
.sheet{background:var(--paper2);border:1px solid var(--line);padding:1.4rem 1.6rem;line-height:1.95;font-size:1.05rem}
.pen{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.5rem;text-align:left;width:100%;padding:.8rem .2rem;border-bottom:1px solid var(--line);line-height:1.55;align-items:start}
.pen .n{font-family:var(--mono);font-size:.8rem;color:var(--ink3);padding-top:.15rem}
.pen .t{background-image:linear-gradient(var(--acc),var(--acc));background-repeat:no-repeat;background-position:0 58%;background-size:0 3px;transition:background-size .35s var(--ease)}
.pen.on .t{background-size:100% 3px;color:var(--ink3)}
.pen:hover .t{color:var(--acct)}
.pen .v{grid-column:2;font-size:.92rem;color:var(--ink2);animation:rise .25s var(--ease)}
.pen .v b{color:var(--ink);margin-right:.4rem}.pen .v.x b{color:var(--acct)}
.locked{opacity:.32;pointer-events:none;filter:blur(1.5px)}

/* 表格 */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:.78rem;font-family:var(--mono);border-bottom:1.5px solid var(--ink);padding:.4rem .55rem;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:.42rem .55rem;vertical-align:middle}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.xl{border-collapse:collapse;font-family:var(--mono);font-size:.92rem;width:100%}
.xl th{background:var(--paper2);border:1px solid var(--line);text-align:center;padding:.2rem .5rem;font-size:.72rem;color:var(--ink3)}
.xl td{border:1px solid var(--line);padding:0;white-space:nowrap}
.xl td.rn{background:var(--paper2);text-align:center;font-size:.72rem;color:var(--ink3);padding:0 .45rem;width:2rem}
.cell{display:block;width:100%;min-height:44px;padding:.3rem .55rem;text-align:left;transition:background .15s}
.cell:hover{background:var(--line)}
.cell.fixed{background:var(--ink);color:var(--paper);animation:flip .4s var(--ease)}
@keyframes flip{from{transform:rotateX(90deg)}}
.xl tr{transition:opacity .2s}
.xl tr.dim{opacity:.3}
.xl tr.hit td:not(.rn){background:var(--acc);color:var(--onacc)}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.vs>div{border:1.5px solid var(--ink);padding:.9rem 1.1rem;display:grid;gap:.1rem;min-width:0}
.vs .big{font-family:var(--mono);font-size:clamp(1.5rem,4.2vw,2.5rem);line-height:1.15;font-weight:600}
.vs .bad{color:var(--acct)}
.fxbar{display:grid;grid-template-columns:auto minmax(0,1fr);border:1.5px solid var(--ink);align-items:center;background:var(--paper2)}
.fxbar>span{font-family:var(--mono);font-style:italic;padding:0 .8rem;border-right:1px solid var(--line)}
.fxbar input{border:0;background:transparent;font-family:var(--mono)}
.claim{position:relative;border:1.5px solid var(--ink);padding:1rem 1.1rem;background:var(--paper2);display:grid;gap:.5rem;overflow:hidden;min-width:0}
.claim q{quotes:none;font-weight:700;font-size:1.15rem}
.stamp{position:absolute;right:.6rem;top:.4rem;border:3px solid var(--acc);color:var(--acc);font-weight:800;padding:0 .55rem;rotate:-10deg;font-size:1.15rem;animation:stamp .34s cubic-bezier(.2,1.6,.4,1);background:var(--paper2)}
.stamp.okk{border-color:var(--ink);color:var(--ink)}
@keyframes stamp{from{transform:scale(2.4);opacity:0}}

/* 泳道 + 提醒 */
.lanes{display:grid;gap:.5rem}
.lane{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:center;border-bottom:1px solid var(--line);padding:.5rem 0}
.lane .why{grid-column:1/-1;font-size:.92rem;color:var(--ink2);animation:rise .25s var(--ease)}
.lane .segs{display:flex;gap:.3rem}
.lane .segs button{min-height:44px;min-width:3.6rem;border:1.5px solid var(--line)}
.lane .segs button:hover:not(:disabled){border-color:var(--ink)}
.lane .segs button.r{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.lane .segs button.w{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.gantt{display:grid;gap:.15rem;min-width:0}
.grow2{display:grid;grid-template-columns:2.6rem minmax(0,1fr) 7.5rem;gap:.5rem;align-items:center;min-height:2.5rem}
.gtrack{position:relative;height:1.8rem;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.gwin{position:absolute;top:.25rem;bottom:.25rem;background:var(--line);transition:left .35s var(--ease),width .35s var(--ease)}
.gdl{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.gmark{position:absolute;top:50%;width:.95rem;height:.95rem;margin:-.48rem 0 0 -.48rem;border-radius:50%;background:var(--ink);transition:left .35s var(--ease)}
.gmark.late{background:var(--acc)}
.gruns{position:relative;height:1rem}
.gruns i{position:absolute;top:0;width:1px;height:.6rem;background:var(--ink3)}
.gstat{font-size:.88rem;white-space:nowrap;text-align:right}
.gstat.bad{color:var(--acct);font-weight:700}

/* 看板 x 光 */
.layer{border:1.5px solid var(--ink);padding:.9rem 1rem;position:relative;display:grid;gap:.6rem;min-width:0;animation:rise .35s var(--ease)}
.layer>.tag{position:absolute;top:-.62rem;left:.8rem;background:var(--paper);padding:0 .5rem;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em}
.layer.empty{border-style:dashed;border-color:var(--acc);color:var(--acct)}
.layer.flash{animation:lflash .6s var(--ease)}
@keyframes lflash{30%{background:var(--ink);color:var(--paper)}}
.conn{height:1.3rem;width:2px;background:var(--ink);margin:0 auto;position:relative;overflow:hidden}
.conn::after{content:"";position:absolute;left:-2px;width:6px;height:.5rem;background:var(--acc);animation:connrun 1.1s linear infinite}
@keyframes connrun{from{top:-.5rem}to{top:1.3rem}}
.rulel{font-family:var(--mono);font-size:.88rem;display:grid;gap:.15rem}
.rulel div{padding:.1rem .4rem}
.rulel div.fire{background:var(--acc);color:var(--onacc)}
.bstat{font-weight:700;white-space:nowrap}
.bstat.bad{color:var(--acct)}
.stops{display:flex;flex-wrap:wrap;gap:.4rem}

/* 数据流 */
.flowsvg{width:100%;height:auto;display:block;border:1.5px solid var(--ink);background:var(--paper2)}
.flowsvg .pathl{fill:none;stroke:var(--line);stroke-width:14}
.flowsvg .zone{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.flowsvg text{fill:var(--ink);font-family:var(--sans)}
.flowsvg .gate{cursor:pointer}
.flowsvg .gate circle{fill:var(--paper);stroke:var(--acc);stroke-width:4;transition:all .2s}
.flowsvg .gate text{font-family:var(--mono);font-size:20px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.flowsvg .gate.on circle{fill:var(--ink);stroke:var(--ink)}
.flowsvg .gate.on text{fill:var(--paper)}
.flowsvg .gate.cur circle{stroke-width:7}
.flowsvg .gate:hover circle{stroke-width:8}
.gatel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.gatel h3{font-size:1rem;margin-bottom:.1rem}
.gatel small{display:block;font-weight:400;color:var(--ink3);font-size:.76rem;margin-bottom:.35rem}
.gbtn{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;min-height:46px;border-bottom:1px solid var(--line);line-height:1.35;font-size:.95rem}
.gbtn i{flex:none;font-style:normal;font-family:var(--mono);font-size:.76rem;width:1.5rem;height:1.5rem;border:2px solid var(--acc);border-radius:50%;display:grid;place-items:center}
.gbtn.on i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.gbtn.cur{font-weight:700}
.gbtn:hover{color:var(--acct)}
.leak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem 1.2rem;align-items:center}
.leak .big{font-family:var(--mono);font-size:2.6rem;line-height:1;font-weight:600}

/* 脱敏 */
.rdout{background:var(--paper2);border:1.5px solid var(--ink);padding:.8rem 1rem;line-height:1.95;min-height:7rem;word-break:break-word;white-space:pre-wrap}
.rdout mark{background:var(--ink);color:var(--paper);padding:.05em .3em;font-family:var(--mono);font-size:.85em}
.rdout mark.new{animation:wipe .4s var(--ease)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* 紫外灯 */
.mail{position:relative;border:1.5px solid var(--ink);background:var(--paper2);overflow:hidden;touch-action:none;cursor:crosshair;user-select:none}
.mailb{padding:1.3rem 1.5rem 1.6rem;display:grid;gap:.7rem;line-height:1.75}
.mail .hid{color:var(--paper2);font-size:.92rem}
.uv{position:absolute;inset:0;background:var(--ink);color:var(--paper);--x:-200px;--y:-200px;-webkit-mask-image:radial-gradient(circle 7rem at var(--x) var(--y),#000 72%,transparent 100%);mask-image:radial-gradient(circle 7rem at var(--x) var(--y),#000 72%,transparent 100%);pointer-events:none}
.uv.all{-webkit-mask-image:none;mask-image:none}
.uv .hid{color:var(--acc);font-weight:700}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;align-items:start}
.cnode{display:grid;justify-items:center;gap:.3rem;text-align:center;position:relative;font-size:.86rem;line-height:1.35;opacity:.3;transition:opacity .25s}
.cnode.lit{opacity:1}
.cnode i{width:3.1rem;height:3.1rem;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--paper);z-index:1;transition:all .2s var(--ease)}
.cnode.lit i{background:var(--ink);color:var(--paper)}
.cnode.block i{background:var(--paper);color:var(--ink);border-style:dashed}
.cnode.out i{background:var(--acc);border-color:var(--acc);color:var(--onacc);transform:scale(1.15)}
.cnode.ask i{background:var(--paper);color:var(--acct);border-color:var(--acc)}
.cnode::before{content:"";position:absolute;top:1.5rem;left:-50%;width:100%;height:2px;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .35s var(--ease)}
.cnode:first-child::before{display:none}
.cnode.lit::before{transform:scaleX(1)}

/* 体检 */
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:center}
.gauge svg{width:8rem;height:8rem;display:block}
.gauge circle{fill:none;stroke-width:10}
.gauge .bg{stroke:var(--line)}
.gauge .fg{stroke:var(--ink);transition:stroke-dashoffset .5s var(--ease);transform:rotate(-90deg);transform-origin:center}
.gauge .fg.low{stroke:var(--acc)}
.gauge text{font-family:var(--mono);font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-weight:600}
.catbars{display:grid;gap:.25rem}
.catbars>div{display:grid;grid-template-columns:3.5rem minmax(0,1fr) 2.5rem;gap:.5rem;align-items:center;font-size:.85rem}
.catbars .tr{height:.5rem;background:var(--line);position:relative}
.catbars .tr i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .35s var(--ease)}
.nexts{display:grid;gap:.25rem;margin:0;padding:0;list-style:none;counter-reset:n}
.nexts li{counter-increment:n;display:grid;grid-template-columns:1.6rem minmax(0,1fr);animation:rise .3s var(--ease)}
.nexts li::before{content:counter(n);font-family:var(--mono);color:var(--acct);font-weight:700}

/* 规范 */
.policy{background:var(--paper2);border:1.5px solid var(--ink);padding:clamp(1rem,4vw,2.4rem);white-space:pre-wrap;line-height:1.85;position:relative;min-width:0;word-break:break-word}

/* 旋钮 */
.knobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.knob{display:grid;gap:.6rem;justify-items:center;text-align:center;border:1.5px solid var(--ink);padding:1rem .7rem;min-width:0;align-content:start}
.knob svg{width:9rem;height:9rem;touch-action:none;cursor:grab;display:block;border-radius:50%}
.knob svg:focus:not(:focus-visible){outline:none}
.knob svg:active{cursor:grabbing}
.knob .dot{transition:transform .28s cubic-bezier(.3,1.6,.5,1);transform-origin:60px 60px}
.knob .need{font-size:.92rem;color:var(--ink2);min-height:5rem}
.knob .stops{justify-content:center}
.knob .chip{min-height:38px;font-size:.8rem;padding:.15rem .5rem}

/* FDE */
.quad{display:grid;grid-template-columns:2rem repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(7rem,auto)) 1.6rem;gap:0;position:relative}
.quad .ax{font-family:var(--mono);font-size:.72rem;color:var(--ink3);letter-spacing:.08em;display:grid;place-items:center}
.quad .ax.v{writing-mode:vertical-rl;grid-row:1/3;grid-column:1;transform:rotate(180deg)}
.quad .ax.h{grid-column:2/4;grid-row:3}
.qc{border:1px solid var(--ink);padding:.8rem .9rem;display:grid;align-content:start;gap:.1rem;transition:background .3s,color .3s;line-height:1.4}
.qc b{font-size:1.05rem}
.qc span{font-size:.8rem}
.qc.on{background:var(--ink);color:var(--paper)}
.qdot{position:absolute;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--acc);border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink);transition:left .5s cubic-bezier(.3,1.5,.5,1),top .5s cubic-bezier(.3,1.5,.5,1);z-index:2}

/* 要点、边界卡、翻页 */
.points{list-style:none;padding:0;display:grid}
.points li{padding:.75rem 0;border-top:1px solid var(--line);font-size:1.08rem}
.points li:last-child{border-bottom:1px solid var(--line)}
.bcard{border:1.5px dashed var(--ink);padding:1.1rem 1.25rem;display:grid;gap:.6rem;position:relative}
.bcard textarea{min-height:4.6rem;background:transparent}
.lnav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;border-top:1.5px solid var(--ink);padding-top:1.1rem}
.lnav .btn.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 7px var(--acc)}}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(1.2rem,env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:.9rem;align-items:center;background:var(--ink);color:var(--paper);padding:.7rem 1.2rem;max-width:calc(100vw - 32px);animation:toast .5s cubic-bezier(.2,1.5,.4,1)}
#toast canvas{width:3.2rem;height:3.2rem;flex:none}
#toast b{display:block;line-height:1.3}
#toast span{font-size:.82rem}
@keyframes toast{from{transform:translateY(140%)}}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;padding-top:clamp(1.5rem,4vw,3.2rem)}
.hero h1{font-size:clamp(2.7rem,6.2vw,5.2rem);line-height:1.06;margin:.5rem 0 .9rem;letter-spacing:-.025em}
.hero .sub{font-size:1.2rem;color:var(--ink2);max-width:30rem}
.orb{display:grid;justify-items:center;gap:.5rem;min-width:0}
.orb canvas{width:min(100%,27rem);aspect-ratio:1;display:block;image-rendering:pixelated;cursor:pointer}
.orb .res{font-size:clamp(1.5rem,3.6vw,2.2rem);font-weight:800;line-height:1.2;text-align:center}
.orb .why{color:var(--ink2);text-align:center;max-width:26rem;min-height:3.4rem;font-size:.98rem}
.tryit{display:grid;gap:.9rem;border:1.5px solid var(--ink);padding:1.1rem 1.25rem;margin-top:1.4rem;background:var(--paper2)}
.trq{display:grid;gap:.3rem}
.trq p{font-weight:700}
.trq .row .chip{flex:1;min-width:6rem}
.trq.off{opacity:.3;pointer-events:none;transition:opacity .2s}
#taskS{font-weight:600}
.smap{display:grid;gap:1.1rem}
.smrow{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:1rem;align-items:start;border-top:1px solid var(--line);padding-top:.9rem}
.smrow>div:first-child b{display:block;font-size:1.2rem;line-height:1.25}
.smrow>div:first-child span{font-size:.8rem;color:var(--ink3);line-height:1.35;display:block}
.stns{display:flex;flex-wrap:wrap;gap:.4rem}
.stn{display:grid;justify-items:center;gap:.2rem;width:7rem;text-align:center;line-height:1.3;font-size:.86rem;padding:.25rem .1rem;position:relative;transition:transform .18s var(--ease)}
.stn:hover{transform:translateY(-5px);color:var(--acct)}
.stn canvas{width:4.6rem;height:4.6rem;display:block;border-radius:50%;transition:box-shadow .15s}
.stn .no{font-family:var(--mono);font-size:.68rem;color:var(--ink3)}
.stn.next canvas{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--acc)}
.stn.done::after{content:"✓";position:absolute;top:.1rem;left:50%;margin-left:1.3rem;width:1.5rem;height:1.5rem;background:var(--ink);color:var(--paper);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;border:2px solid var(--paper)}
.parallel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
.parallel .parhead{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.4rem;flex-wrap:wrap}
.parallel .parhead b{font-size:1.2rem}
.parallel .parhead span{font-size:.8rem;color:var(--ink3)}
.thr{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--ink2);border-block:1.5px solid var(--ink);padding:.55rem 0;text-align:center}

/* 课件 */
.overlay{position:fixed;inset:0;z-index:50;background:#0C0C0C;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:.75rem}
.stage{align-self:center;justify-self:center;width:min(100%,calc((100vh - 7rem)*16/9));max-width:100%;aspect-ratio:16/9;background:#ECE9E2;color:#161616;container-type:inline-size;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:6cqw 6cqw;gap:3cqw;overflow:hidden;position:relative}
.stage .shdr{position:absolute;top:2.2cqw;left:2.6cqw;right:2.6cqw;display:flex;justify-content:space-between;font-family:var(--mono);font-size:1.1cqw;letter-spacing:.14em;color:#6B6863}
.stage .sk{font-size:1.5cqw;font-family:var(--mono);color:#AE3D17;letter-spacing:.1em;margin-bottom:1.2cqw}
.stage .sb{font-size:4.6cqw;font-weight:800;line-height:1.24}
.stage .ss{font-size:2.2cqw;color:#4C4A46;line-height:1.5;margin-top:1.4cqw}
.stage canvas{width:22cqw;height:22cqw}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center;color:#C9C5BC;font-size:.9rem}
.ctl button{min-height:44px;padding:.3rem 1rem;border:1px solid #6B6863;color:#ECE9E2}
.ctl button:hover{background:#ECE9E2;color:#161616}

/* 视频 */
.vidbox{border:1.5px solid var(--ink);display:grid;background:var(--ink);min-width:0}
.vidbox video{width:100%;display:block;aspect-ratio:16/9;background:#000}

@media (max-width:860px){
  #ticks{display:none}#top{justify-content:space-between}
  .lhead{gap:1rem}
  .hero,.nw,.termgrid,.twocol{grid-template-columns:minmax(0,1fr)}
  .orb canvas{width:min(70%,18rem)}
  .parallel,.knobs{grid-template-columns:minmax(0,1fr)}
  .gatel{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  html{font-size:17px}
  .lhead{grid-template-columns:minmax(0,1fr) 5rem}
  .lhead canvas{width:5rem;height:5rem;align-self:start}
  .sbins{gap:.3rem}
  .sbin{padding:.5rem .25rem;min-height:7.2rem}
  .sbin canvas{width:2.8rem;height:2.8rem}
  .sbin span{display:none}
  .smrow{grid-template-columns:minmax(0,1fr)}
  .stn{width:calc(33.3% - .3rem)}
  .vs{grid-template-columns:minmax(0,1fr)}
  .grow2{grid-template-columns:2.2rem minmax(0,1fr) 5.4rem}
  .tree2{grid-template-columns:minmax(0,1fr)}
  .chain{font-size:.8rem}
  .cnode i{width:2.6rem;height:2.6rem}
  .cnode::before{top:1.25rem}
  .bins{height:7.5rem}
  .gauge{grid-template-columns:minmax(0,1fr);justify-items:center}
  .gauge>div{justify-self:stretch}
  .leak{grid-template-columns:minmax(0,1fr)}
  .tbtn{padding:0 .3rem;min-width:40px}
  .brand .bp{display:none}
}

 try{

 }catch(e){}

/* 抖动标本：灰度小画面 → Bayer 阈值 → 墨 / 纸 / 橙，放进圆窗 */
const BAYER=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v=>(v+.5)/64);

function tokens(){

 const dark=rgb('--paper')[0]<90;

 const lit=OC.createRadialGradient(lx,ly,6,50,50,78);lit.addColorStop(0,'#ffffff');lit.addColorStop(.6,'#f2f2f2');lit.addColorStop(1,'#a8a8a8');

 for(let y=0,i=0;y<n;y++)for(let x=0;x<n;x++,i+=4){

  if(!o.square&&X*X+Y*Y>r0*r0-1){d[i+3]=0;continue}
  const R=d[i],Gg=d[i+1],B=d[i+2],L=(R*.3+Gg*.59+B*.11)/255,t=BAYER[(y&7)*8+(x&7)];

  if(dx!==undefined&&t>dx)c=ink;

 }

 if(!o.noedge&&!o.square){cx.strokeStyle='rgb('+ink.join(',')+')';cx.lineWidth=Math.max(1,n/96);cx.beginPath();cx.arc(r0,r0,r0-cx.lineWidth/2,0,7);cx.stroke()}
}

function src(root,links){root.append(mk('<p class="src">'+links.map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>').join(' · ')+'</p>'))}

L.push({id:'ai',mod:'base',title:'AI 是怎么回事',min:6,goal:'知道 AI 为什么会编，为什么每次答得不一样。',
 demo:'调“随机程度”，连答 30 次，看同一个问题的答案怎么散开。',
 points:['它在预测下一个词，所以会编。','它只知道你给它的内容，新对话等于新同事。','模型和产品是两回事，联网、读文件是外加的能力。','同样的问题，答案可能不一样，所以要验证。','你输入的数据会传到服务商那里，先弄清去向。'],
 card:'这节课之后，AI 的哪类回答你一定会核对？',
 render(root,done){
  const b=sec(root,'它怎么“回答”','下面是示意：AI 按概率挑下一段话，它没有去查校历。这所大学是虚构的。');
  const O=[['1 月 1 日',52],['1 月 5 日',23],['12 月 15 日',15],['2 月 1 日',10]];
  const w=mk('<div class="panel"><div class="nw"><div style="display:grid;gap:.9rem;align-content:start;min-width:0"><p class="label">这所大学的申请截止日期</p><p class="nwsent" aria-live="polite"><span>这所大学的申请截止日期是</span><em data-a></em></p><label for="nwT">随机程度<input type="range" id="nwT" min="1" max="20" value="10"></label><div class="row"><button type="button" class="btn" data-one>让它回答</button><button type="button" class="btn ghost" data-many>连答 30 次</button></div></div><div style="display:grid;gap:.3rem;align-content:start;min-width:0"><p class="label">下一个词的概率</p><div data-bars></div></div></div><div><div class="bins" data-bins></div><div class="binsl">'+O.map(o=>'<div>'+o[0]+'</div>').join('')+'</div></div><div data-note></div></div>');
  const bars=w.querySelector('[data-bars]'),binsE=w.querySelector('[data-bins]'),a=w.querySelector('[data-a]'),T=w.querySelector('#nwT'),note=w.querySelector('[data-note]');
  O.forEach(o=>{bars.append(mk('<div class="nwbar"><span>'+o[0]+'</span><span class="tr"><i></i></span><span class="mono pct"></span></div>'));binsE.append(mk('<div></div>'))});
  const prob=()=>{const t=+T.value/10,raw=O.map(o=>Math.pow(o[1],1/t)),s=raw.reduce((x,y)=>x+y,0);return raw.map(r=>r/s)};
  const paint=()=>{const p=prob();[...bars.children].forEach((r,i)=>{r.querySelector('i').style.width=(p[i]*100)+'%';r.querySelector('.pct').textContent=Math.round(p[i]*100)+'%'})};
  const pick=()=>{const p=prob();let r=Math.random();for(let i=0;i<p.length;i++){if(r<p[i])return i;r-=p[i]}return 0};
  let n=0,seen=new Set(),timer=null;
  const shot=i=>{n++;seen.add(i);a.textContent=O[i][0]+'。';[...bars.children].forEach((r,k)=>r.classList.toggle('pick',k===i));
   if(binsE.children[i].children.length<60)binsE.children[i].append(mk('<i></i>'));
   if(n>=3&&seen.size>1&&!note.firstChild){note.append(mk('<div class="fb warn"><b>看到了吗</b>每个答案语气都一样肯定，可能都不对。日期要去官网查。</div>'));sfx('ok')}};
  w.querySelector('[data-one]').onclick=()=>{sfx('tick');shot(pick())};
  w.querySelector('[data-many]').onclick=e=>{if(timer)return;let k=0;e.target.disabled=true;timer=setInterval(()=>{sfx('fly');shot(pick());if(++k>=30){clearInterval(timer);timer=null;e.target.disabled=false}},REDUCE?1:70)};
  onClean(()=>{if(timer)clearInterval(timer)});
  T.oninput=paint;paint();b.append(w);
  const q=sec(root,'五个场景');
  deck(q,'ai',[
   {q:'昨天和 AI 聊过一位学生。今天开了新对话问“他的文书怎么样”，它说不知道。为什么？',opts:['AI 出故障了','新对话看不到旧内容，除非产品开了记忆功能','它不愿意回答'],a:1,why:'把背景重新给它。这也是提示词要带上下文的原因。'},
   {q:'AI 说某校今年政策变了，还给了链接。你怎么办？',opts:['有链接就可信，直接转给家长','打开链接，到学校官网核对原文','换个 AI 再问一次，一致就算对'],a:1,why:'链接也可能是编的。多个 AI 说法一致，也不等于事实。'},
   {q:'两位顾问用同一段提示词，得到的答案不一样。这说明什么？',opts:['有人操作错了','其中一个 AI 坏了','正常，生成过程带随机性'],a:2,why:'所以固定流程要靠检查和规则保证质量，不能只靠提示词。'},
   {q:'这个 AI 能联网，是不是就什么都知道了？',opts:['是的，联网后不会错','不是。联网是外加的工具，搜到的内容也会错，也会被它读错','是的，只要网速够快'],a:1,why:'模型负责生成，产品外面再接搜索、读文件等能力。每一层都可能出错。'},
   {q:'想把学生护照页拍照上传给 AI，提取信息。先要想什么？',opts:['照片清不清楚','这份数据会传到哪里、怎么保存，是否取得了同意','AI 能不能识别英文'],a:1,why:'护照属于高敏感信息。第 12 节会教分级。'}
  ],{onDone:done});
 }});

L.push({id:'pc',mod:'base',title:'电脑基础，够用就好',min:8,goal:'不怕命令行，听懂 AI 说的这些词。',

  let cwd='~',lastCat='',step=0;

   {t:'看看当前文件夹里有什么',c:'ls',ok:x=>x==='ls'},
   {t:'进入“学生资料”文件夹',c:'cd 学生资料',ok:()=>cwd==='~/学生资料'},
   {t:'读一下第二版文书',c:'cat S01_文书v2.txt',ok:()=>lastCat==='S01_文书v2.txt'},
   {t:'新建一个“备份”文件夹',c:'mkdir 备份',ok:x=>x==='mkdir 备份'},
   {t:'回到上一层',c:'cd ..',ok:()=>cwd==='~'}

  const log=w.querySelector('.termlog'),inp=w.querySelector('input'),task=w.querySelector('[data-task]'),cw=w.querySelector('.cw'),tree=w.querySelector('.ftree');
  const pr=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight};
  const drawTree=()=>{let h='<p class="label" style="margin-bottom:.3rem">你的文件夹</p><div class="'+(cwd==='~'?'here':'')+'">~ 主目录</div>';FS['~'].d.forEach(n=>{const p='~/'+n;h+='<div class="d1 '+(cwd===p?'here':'')+'">'+esc(n)+'/</div>';if(cwd===p&&FS[p]){FS[p].d.forEach(s=>h+='<div class="d1" style="padding-left:2.6rem">'+esc(s)+'/</div>');Object.keys(FS[p].f).forEach(f=>h+='<div class="d1 '+(lastCat===f?'read':'')+'" style="padding-left:2.6rem">'+esc(f)+'</div>')}});tree.innerHTML=h};
  const paint=()=>{cw.textContent=cwd;drawTree();task.innerHTML='';if(step<T.length){const f=mk('<div class="fb warn"><b>任务 '+(step+1)+'/5</b>'+T[step].t+' <button type="button" class="chip" style="margin-left:.5rem">填入 '+esc(T[step].c)+'</button></div>');f.querySelector('button').onclick=()=>{inp.value=T[step].c;inp.focus();sfx('tick')};task.append(f)}else{task.append(mk('<div class="fb"><b>全部完成</b>让 AI 写程序时，你看到的就是这些命令。AI 会提议，你负责看懂，然后同意。</div>'));done()}};
  pr('输入 help 查看可用命令','dim');
  w.querySelector('form').onsubmit=e=>{e.preventDefault();const x=inp.value.trim();inp.value='';if(!x)return;sfx('tick');pr(cwd+' $ '+x);const[a,...rest]=x.split(/\s+/);const arg=rest.join(' '),n=FS[cwd];lastCat='';
   if(a==='help')pr('ls 看内容   cd 名字 进入   cd .. 返回   cat 名字 读文件   mkdir 名字 新建文件夹   pwd 当前位置','dim');
   else if(a==='ls')pr([...n.d.map(s=>s+'/'),...Object.keys(n.f)].join('\n')||'（空）');
   else if(a==='pwd')pr(cwd);
   else if(a==='cd'){if(arg==='..'){cwd='~'}else if(n.d.includes(arg)&&FS[cwd+'/'+arg])cwd=cwd+'/'+arg;else if(n.d.includes(arg))pr('这是刚建的空文件夹，这次练习先不进去。','dim');else pr('找不到文件夹：'+arg+'。先用 ls 看看名字。','dim')}
   else if(a==='cat'){if(n.f[arg]!==undefined){pr(n.f[arg]);lastCat=arg}else pr('找不到文件：'+arg,'dim')}
   else if(a==='mkdir'){if(arg){n.d.push(arg);pr('已新建 '+arg+'/')}else pr('要写上名字：mkdir 名字','dim')}
   else if(a==='rm')pr('这是删除命令。真实环境里删掉的文件通常找不回来。AI 提议用 rm 时，要看清删的是什么。','dim');
   else pr('没有这个命令：'+a+'。输入 help 查看。','dim');

 }});

  /* 公式求值：SUM、SUMIFS 加四则运算，不用 eval */
  const colRange=c=>{const m=/^([A-E]):\1$/.exec(c.trim());return m?COL[m[1]]:null};
  const splitArgs=s=>{const out=[];let q=false,cur='';for(const ch of s){if(ch==='"')q=!q;if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out};
  const evalF=(src0)=>{
   let s=src0.trim().replace(/^=/,'').toUpperCase().replace(/，/g,',').replace(/[“”]/g,'"');
   let hl=null;
   s=s.replace(/SUM(IFS)?\(([^()]*)\)/g,(m,ifs,args)=>{const ar=splitArgs(args),c=colRange(ar[0]);if(c===null)throw new Error('求和范围要写成 D:D 这样');const pairs=[];for(let i=1;i<ar.length;i+=2){const k=colRange(ar[i]),v=(ar[i+1]||'').trim().replace(/^"|"$/g,'');if(k===null||ar[i+1]===undefined)throw new Error('条件要成对：范围,"内容"');pairs.push([k,v])}if(!ifs&&pairs.length)throw new Error('SUM 只接一个范围');const ok=rows.map(r=>pairs.every(([k,v])=>String(r[k])===v));if(pairs.length)hl=ok;return '('+rows.reduce((t,r,i)=>ok[i]&&typeof r[c]==='number'?t+r[c]:t,0)+')'});
   if(/[^0-9+\-*/().\s]/.test(s))throw new Error('这里只支持 SUM、SUMIFS 和加减乘除');
   let p=0;const ws2=()=>{while(s[p]===' ')p++};
   const prim=()=>{ws2();if(s[p]==='('){p++;const v=exprr();ws2();if(s[p]!==')')throw new Error('括号没配对');p++;return v}if(s[p]==='-'){p++;return -prim()}const m=/^\d+(\.\d+)?/.exec(s.slice(p));if(!m)throw new Error('公式没写完');p+=m[0].length;return +m[0]};
   const term=()=>{let v=prim();for(;;){ws2();if(s[p]==='*'){p++;v*=prim()}else if(s[p]==='/'){p++;const d=prim();if(!d)throw new Error('除数是 0');v/=d}else return v}};
   const exprr=()=>{let v=term();for(;;){ws2();if(s[p]==='+'){p++;v+=term()}else if(s[p]==='-'){p++;v-=term()}else return v}};
   const v=exprr();ws2();if(p<s.length)throw new Error('公式没写完');return{v,hl};
  };
  const inp=ws.querySelector('#fxIn'),V=ws.querySelector('[data-out]'),E=ws.querySelector('[data-e]');
  let g='王',t='收款';
  const build=()=>{const parts=[];if(g)parts.push('E:E,"'+g+'"');if(t)parts.push('C:C,"'+t+'"');return parts.length?'=SUMIFS(D:D,'+parts.join(',')+')':'=SUM(D:D)'};
  const run=()=>{ws.querySelectorAll('[data-g] button').forEach(x=>x.classList.toggle('on',x.dataset.v===g));ws.querySelectorAll('[data-t] button').forEach(x=>x.classList.toggle('on',x.dataset.v===t));
   try{const{v,hl}=evalF(inp.value);E.textContent='';const isPct=Math.abs(v)<1000&&!Number.isInteger(v);if(isPct){V.dataset.v=0;V.textContent=v.toFixed(3)}else countTo(V,Math.round(v),fmt);ws.querySelectorAll('tr[data-r]').forEach((tr,i)=>{tr.classList.toggle('hit',!!hl&&hl[i]);tr.classList.toggle('dim',!!hl&&!hl[i])})}
   catch(e){E.textContent=e.message;ws.querySelectorAll('tr[data-r]').forEach(tr=>tr.className='')}};
  ws.querySelectorAll('[data-g] button').forEach(x=>x.onclick=()=>{g=x.dataset.v;inp.value=build();sfx('tick');run()});
  ws.querySelectorAll('[data-t] button').forEach(x=>x.onclick=()=>{t=x.dataset.v;inp.value=build();sfx('tick');run()});
  inp.oninput=run;inp.value=build();a.append(claims,ws);run();
  const c=sec(root,'填入你算出的结果','退费率试试直接改公式：=-SUMIFS(D:D,C:C,"退费")/SUMIFS(D:D,C:C,"收款")*100');
  const form=mk('<form class="sec"><div class="twocol" style="grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))"><label for="vA">王老师 10 月收款（元）<input type="number" id="vA" inputmode="numeric"></label><label for="vB">退费总额（元，填正数）<input type="number" id="vB" inputmode="numeric"></label><label for="vC">退费率（%，保留 1 位小数）<input type="number" id="vC" step="0.1" inputmode="decimal"></label></div><div class="row"><button class="btn">检查</button></div><div data-res aria-live="polite"></div></form>');
  form.onsubmit=e=>{e.preventDefault();const A=+form.vA.value,B=+form.vB.value,C=+form.vC.value;const coll=rows.filter(r=>r[2]==='收款').reduce((s,r)=>s+r[3],0),refund=-rows.filter(r=>r[2]==='退费').reduce((s,r)=>s+r[3],0),wang=rows.filter(r=>r[2]==='收款'&&r[4]==='王').reduce((s,r)=>s+r[3],0),rate=refund/coll*100;
   const okA=A===wang,okB=B===refund,okC=Math.abs(C-rate)<0.06;
   form.querySelector('[data-res]').innerHTML='<div class="fb '+(okA?'':'bad')+'"><b>'+(okA?'对':'再算算')+'</b>王老师收款'+(okA?' '+fmt(wang)+'。':'：顾问选“王”，类别选“收款”。')+'</div><div class="fb '+(okB?'':'bad')+'"><b>'+(okB?'对':'再算算')+'</b>退费总额'+(okB?' '+fmt(refund)+'。':'：类别选“退费”，结果取正数。')+'</div><div class="fb '+(okC?'':'bad')+'"><b>'+(okC?'对':'再算算')+'</b>退费率'+(okC?' '+rate.toFixed(1)+'%。':'：退费总额除以收款总额。')+'</div>';
   const st=(k,on,txt)=>{const cl=claims.querySelector('[data-c='+k+']');cl.querySelector('.stamp')?.remove();cl.querySelector('.tru')?.remove();if(on){cl.append(mk('<span class="stamp">错</span>'));cl.append(mk('<span class="tru small">算出来是 '+txt+'</span>'))}};
   st('w',okA,fmt(wang));st('r',okC,rate.toFixed(1)+'%');
   sfx(okA&&okB&&okC?'stamp':'no');if(okA&&okB&&okC){claims.scrollIntoView({behavior:REDUCE?'auto':'smooth',block:'center'});done()}};
  c.append(form);
  const d=sec(root,'换成你的账');
  [['ld1','流水表统一成 日期 / 学生代号 / 类别 / 金额 / 顾问'],['ld2','用 AI 写出汇总公式，并看懂了每一条'],['ld3','汇总页有：月收入、各顾问产出、退费率'],['ld4','抽查了 3 个数字，都和原始账对得上']].forEach(([k,t2])=>{const l=mk('<label class="tog" for="'+k+'"><input type="checkbox" id="'+k+'"><span>'+t2+'</span></label>');const i=l.querySelector('input');i.checked=!!S.form[k];i.onchange=()=>{S.form[k]=i.checked;save();sfx('tick')};d.append(l)});
 }});

L.push({id:'spec',mod:'build',title:'定义问题',min:8,goal:'把模糊的想法，写成 AI 能照着做、你能照着验收的需求。',

 clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3600);
}
function paintDone(b,id){b.textContent=S.done[id]?'已完成 ✓':'标记完成';b.className=S.done[id]?'btn ghost':'btn ghost'}
function render(){
 main.innerHTML='';const w=mk('<div class="wrap"></div>');main.append(w);
 if(cur==='home')return home(w);
 if(cur==='teach')return teach(w);
 const x=L.find(l=>l.id===cur),m=MODS.find(y=>y.id===x.mod);
 const head=mk('<header class="lhead"><div><div class="metarow"><span class="label">No.'+nn(x.no)+' / '+L.length+'</span><span class="label">'+m.name+'</span><span class="label">约 '+x.min+' 分钟</span>'+(x.thread?'<span class="label">贯穿：'+x.thread+'</span>':'')+'</div><h1>'+x.title+'</h1><p class="goal">'+x.goal+'</p><div class="row" style="margin-top:.9rem"><button type="button" class="chip" data-sl>课件模式</button></div></div></header>');
 head.append(spec(GLYPH[x.id],128));head.querySelector('[data-sl]').onclick=()=>openSlides(x);w.append(head);
 if(x.project)w.append(mk('<section class="pblock"><p class="label">这是一个真实项目</p><dl><dt>目标</dt><dd>'+x.project.goal+'</dd><dt>交付</dt><dd>'+x.project.out+'</dd><dt>完成标志</dt><dd>'+x.project.pass+'</dd></dl></section>'));
 x.render(w,()=>markDone(x.id));
 const p=sec(w,'带走这几条');p.append(mk('<ul class="points">'+x.points.map(t=>'<li>'+t+'</li>').join('')+'</ul>'));
 if(x.card){const c=sec(w,'我的边界卡');const b=mk('<div class="bcard"><p>'+x.card+'</p><textarea id="card'+x.id+'" aria-label="边界卡" placeholder="写一句就够。最后会汇入机构规范。"></textarea><span class="small" data-s></span></div>');const t=b.querySelector('textarea');t.value=S.cards[x.id]||'';const nt=b.querySelector('[data-s]');t.oninput=()=>{S.cards[x.id]=t.value;save();nt.textContent=t.value.trim()?'已存好，第 15 节的规范里会用到。':''};c.append(b)}
 const i=L.findIndex(y=>y.id===x.id),n=L[i+1];
 const ln=mk('<div class="lnav"><button type="button" id="doneBtn"></button><button type="button" class="btn'+(S.done[x.id]?'':' ghost')+'" id="nextBtn">'+(n?'下一节：'+n.title:'回到首页')+'</button></div>');
 w.append(ln);const db=ln.querySelector('#doneBtn');paintDone(db,x.id);db.onclick=()=>{if(S.done[x.id]){S.done[x.id]=0;save();paintDone(db,x.id);drawTicks()}else markDone(x.id)};
 ln.querySelector('#nextBtn').onclick=()=>go(n?n.id:'home');
}
/* 首页：框架本身就是第一个可以玩的东西 */
const TASKS=[
 {t:'每月按流水表算顾问收入',clear:1,messy:0},
 {t:'帮学生想文书立意',clear:0,messy:1},
 {t:'把家长的长微信整理成待办',clear:1,messy:1},
 {t:'截止日期前 14 天提醒',clear:1,messy:0},
 {t:'分析最近退费变多的原因',clear:0,messy:1},
 {t:'每周根据笔记写家长周报草稿',clear:1,messy:1}
];
const RES={
 chat:{g:'bubble',n:'和它对话',w:'规则说不清，就多聊。让它追问、反驳，你来拿主意。',to:'route'},
 flow:{g:'belt',n:'把 AI 嵌进流程',w:'规则清楚，输入却乱。固定提示词，定时跑，人看例外。',to:'loop'},
 build:{g:'abacus',n:'让 AI 造个工具',w:'规则清楚还能写死。工具造好就不再需要 AI，同样的输入永远同样的答案。',to:'spec'}
};
function home(w){
 const next=L.find(x=>!S.done[x.id])||L[0],started=doneCount()>0;
 const hero=mk('<section class="hero"><div style="min-width:0"><p class="label">留学机构版 · 17 节 · 每一步马上知道对不对</p><h1>学 AI，<br>学的是<span class="acc">分工</span>。</h1><p class="sub">同一个 AI，有的事该聊，有的事该放进流程，有的事该让它造个工具。先拿一件事试试。</p><div class="tryit"><div class="trq"><p>这件事是</p><div class="stops" id="taskS"></div></div><div class="trq" id="q1"><p>1. 规则说得清吗？</p><div class="row"><button type="button" class="chip" data-a="0">说不清，要边想边试</button><button type="button" class="chip" data-a="1">说得清</button></div></div><div class="trq" id="q2"><p>2. 输入乱不乱？</p><div class="row"><button type="button" class="chip" data-a="1">很乱，要读懂才行</button><button type="button" class="chip" data-a="0">规整，能写死</button></div></div></div></div><div class="orb"><canvas id="orb" width="162" height="162" aria-hidden="true"></canvas><div class="res" aria-live="polite"></div><div class="why"></div><button type="button" class="btn" id="orbGo"></button></div></section>');
 w.append(hero);
 const cv=hero.querySelector('#orb'),res=hero.querySelector('.res'),why=hero.querySelector('.why'),gob=hero.querySelector('#orbGo');
 const stEl=hero.querySelector('#taskS');
 let task=0,clear=1,messy=0,curK=null,dis=1,lx=35,ly=28,tx=35,ty=28,raf=0,prevG=null;
 const key=()=>clear?(messy?'flow':'build'):'chat';
 const paint=(snd)=>{
  stEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===task));
  hero.querySelectorAll('#q1 button').forEach(b=>b.classList.toggle('on',+b.dataset.a===clear));
  hero.querySelectorAll('#q2 button').forEach(b=>b.classList.toggle('on',+b.dataset.a===messy));
  hero.querySelector('#q2').classList.toggle('off',!clear);
  const k=key();if(k!==curK){curK=k;dis=.22;if(snd)sfx('ok')}else if(snd)sfx('tick');
  const r=RES[k];res.textContent=r.n;why.textContent=r.w;gob.textContent='去练这个 →';gob.onclick=()=>go(r.to);
 };
 TASKS.forEach((t,i)=>{const b=mk('<button type="button" class="chip">'+t.t+'</button>');b.onclick=()=>{task=i;clear=t.clear;messy=t.messy;paint(true)};stEl.append(b)});
 hero.querySelectorAll('#q1 button').forEach(b=>b.onclick=()=>{clear=+b.dataset.a;paint(true)});
 hero.querySelectorAll('#q2 button').forEach(b=>b.onclick=()=>{messy=+b.dataset.a;paint(true)});
 paint(false);
 /* 圆窗：跟着鼠标打光；换用法时抖动溶解 */
 const onM=e=>{const r=cv.getBoundingClientRect();tx=Math.max(5,Math.min(95,(e.clientX-r.left)/r.width*100));ty=Math.max(5,Math.min(95,(e.clientY-r.top)/r.height*100))};
 window.addEventListener('pointermove',onM);onClean(()=>window.removeEventListener('pointermove',onM));
 let last=0;
 const frame=t=>{raf=requestAnimationFrame(frame);if(t-last<40||document.hidden)return;last=t;const dx=tx-lx,dy=ty-ly;if(Math.abs(dx)+Math.abs(dy)<.3&&dis>=1)return;lx+=dx*.14;ly+=dy*.14;dis=Math.min(1,dis+.09);renderSpec(cv,RES[curK].g,{res:162,lx,ly,dissolve:dis,noedge:true})};
 renderSpec(cv,RES[curK].g,{res:162,lx,ly,noedge:true});
 if(!REDUCE)raf=requestAnimationFrame(frame);onClean(()=>cancelAnimationFrame(raf));
 /* 地图 */
 const go1=mk('<div class="row"><button type="button" class="btn">'+(started?'继续：':'从头开始：')+next.title+'</button><span class="small">'+doneCount()+'/'+L.length+' 已归档。进度和写下的内容只存在这台设备的浏览器里。</span></div>');go1.firstChild.onclick=()=>go(next.id);w.append(go1);
 const stn=x=>{const b=mk('<button type="button" class="stn'+(S.done[x.id]?' done':'')+(x===next&&!S.done[x.id]?' next':'')+'"><span class="no">'+nn(x.no)+'</span><span>'+x.title.replace('项目：','')+'</span></button>');b.insertBefore(spec(GLYPH[x.id],84),b.children[1]);b.onclick=()=>go(x.id);return b};
 const row=id=>{const m=MODS.find(y=>y.id===id),r=mk('<div class="smrow"><div><b>'+m.name+'</b><span>'+m.sub+'</span></div><div class="stns"></div></div>');L.filter(x=>x.mod===id).forEach(x=>r.querySelector('.stns').append(stn(x)));return r};
 const map=mk('<section class="smap" aria-label="课程地图"><h2 style="font-size:1.65rem">17 节课的地图</h2></section>');
 map.append(row('base'),row('chat'));
 const par=mk('<div class="parallel"></div>');[['flow','第三关 A 用起来'],['build','第三关 B 造出来']].forEach(([id,n])=>{const m=MODS.find(y=>y.id===id),c=mk('<div style="border-top:1px solid var(--line);padding-top:.9rem;min-width:0"><div class="parhead"><b>'+n+'</b><span>'+m.sub+'</span></div><div class="stns"></div></div>');L.filter(x=>x.mod===id).forEach(x=>c.querySelector('.stns').append(stn(x)));par.append(c)});
 map.append(mk('<p class="small" style="margin-bottom:-.6rem">学完对话，下面两条按任务选，不分先后。</p>'),par,mk('<div class="thr">贯穿每一节 · 验证结果 · 安全与责任 · 自己的能力不外包</div>'),row('safe'),row('grow'),row('fde'));
 w.append(map);
}
function teach(w){
 w.append(mk('<header class="lhead" style="grid-template-columns:minmax(0,1fr)"><div><p class="label">讲师</p><h1>课件与视频</h1><p class="goal">每节课一条视频：先用课件讲清要点，再录屏演示互动，最后留一个真实项目。</p></div></header>'));
 const t=mk('<section class="sec"><div class="tw"><table><tbody><tr><th>节</th><th>视频题目</th><th>时长</th><th>录屏演示</th><th></th></tr></tbody></table></div></section>');
 const tb=t.querySelector('tbody');
 L.forEach(x=>{const r=mk('<table><tr><td class="num">'+nn(x.no)+'</td><td style="min-width:8rem;font-weight:600">'+x.title+(x.id==='route'?' <span class="label acc">已出片</span>':'')+'</td><td class="num">'+(x.id==='route'?'成片':Math.max(3,Math.round(x.min*.7))+' 分')+'</td><td style="min-width:12rem">'+x.demo+'</td><td></td></tr></table>').querySelector('tr');const b=mk('<button type="button" class="chip" style="white-space:nowrap">课件</button>');b.onclick=()=>openSlides(x);r.lastElementChild.append(b);tb.append(r)});
 w.append(t);
 w.append(mk('<p class="small">未出片的时长是按互动时间估算的初稿。课件模式可以全屏录制，用方向键翻页。</p>'));
}
function openSlides(x){
 const m=MODS.find(y=>y.id===x.mod);
 const P=[{k:m.name+' · 第 '+x.no+' 节',b:x.title,s:x.goal,o:1},...x.points.map((p,i)=>({k:'要点 '+(i+1)+'/'+x.points.length,b:p})),{k:'现在动手',b:x.demo,s:x.project?'项目交付：'+x.project.out:'',o:1}];
 let i=0;
 slides.hidden=false;slides.innerHTML='<div class="stage" role="group" aria-label="课件"></div><div class="ctl"><button type="button" data-a="p">上一页</button><span class="mono" data-a="n"></span><button type="button" data-a="f">全屏</button><button type="button" data-a="x">退出</button><button type="button" data-a="q">下一页</button></div>';
 const st=slides.querySelector('.stage');
 const dr=()=>{const p=P[i];st.innerHTML='<div class="shdr"><span>CATFISH 猫鱼说</span><span>AI 上手课 · No.'+nn(x.no)+'</span></div><div><div class="sk">'+p.k+'</div><div class="sb">'+p.b+'</div>'+(p.s?'<div class="ss">'+p.s+'</div>':'')+'</div>';if(p.o){const c=spec(GLYPH[x.id],144);st.append(c)}slides.querySelector('[data-a=n]').textContent=(i+1)+'/'+P.length;sfx('tick')};
 const close=()=>{slides.hidden=true;slides.innerHTML='';document.removeEventListener('keydown',key);try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
 const key=e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();i=Math.min(P.length-1,i+1);dr()}else if(e.key==='ArrowLeft'){i=Math.max(0,i-1);dr()}else if(e.key==='Escape')close()};
 document.addEventListener('keydown',key);onClean(close);
 slides.querySelector('[data-a=p]').onclick=()=>{i=Math.max(0,i-1);dr()};
 slides.querySelector('[data-a=q]').onclick=()=>{i=Math.min(P.length-1,i+1);dr()};
 slides.querySelector('[data-a=x]').onclick=close;
 slides.querySelector('[data-a=f]').onclick=()=>{try{const r=slides.requestFullscreen&&slides.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}};
 dr();
}
document.getElementById('homeBtn').onclick=()=>go('home');
document.getElementById('menuBtn').onclick=openDrawer;
document.getElementById('sizeBtn').onclick=()=>{S.size=((S.size||0)+1)%3;save();applySize();drawTicks();sfx('tick')};
document.getElementById('sndBtn').onclick=()=>{S.snd=S.snd?0:1;save();drawTicks();sfx('ok')};
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{TK=null;render()})}catch(e){}
try{new MutationObserver(()=>{TK=null;render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
applySize();
const h0=(location.hash||'').slice(1);if(L.some(x=>x.id===h0)||h0==='teach')cur=h0;
drawTicks();render();

})();
</script>
