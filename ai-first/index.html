<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/assets/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>AI 上手课</title>
<style>
/* 课程介绍页：一个大圆窗 + 一张可点的课程表。纸白、墨黑、鲇鱼橙。 */
:root{--paper:#ECE9E2;--paper2:#F4F2EC;--ink:#161616;--ink2:#4C4A46;--ink3:#6B6863;--line:#C9C5BC;--acc:#D9542B;--acct:#AE3D17;--onacc:#FFFFFF;--sans:"CF Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--mono:"CF Mono","Cascadia Mono",ui-monospace,Consolas,"CF Sans","Microsoft YaHei",monospace;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161616;--paper2:#201F1D;--ink:#ECE9E2;--ink2:#C4C0B8;--ink3:#A09C95;--line:#3B3936;--acc:#E8683F;--acct:#F08A66;--onacc:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161616;--paper2:#201F1D;--ink:#ECE9E2;--ink2:#C4C0B8;--ink3:#A09C95;--line:#3B3936;--acc:#E8683F;--acct:#F08A66;--onacc:#161616;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:18px;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}
h1,h2,h3,p,dl,dd{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:800;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acct)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(3rem,7vw,5.5rem);border-top:1px solid var(--line)}
.shead{display:grid;gap:.6rem;margin-bottom:2rem;max-width:44rem}
.shead h2{font-size:clamp(1.65rem,3.4vw,2.5rem)}
.shead p{color:var(--ink2)}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.4rem;padding-block:.4rem}
.brand{font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;color:var(--ink2);white-space:nowrap}
.brand b{font-family:var(--sans);font-weight:600;color:var(--ink);letter-spacing:.04em}
.go{display:inline-flex;align-items:center;min-height:44px;padding-inline:1.2rem;border-radius:999px;background:var(--ink);color:var(--paper);font-size:.92rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.go:hover{background:var(--acc);color:var(--onacc)}

.hero{border-top:0;padding-block:clamp(2.2rem,5vw,4rem)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.3rem);line-height:1.12}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero .lead{margin-top:1.3rem;font-size:1.14rem;color:var(--ink2);max-width:34rem}
.hero canvas{display:block;width:100%;max-width:400px;aspect-ratio:1;margin-inline:auto;image-rendering:pixelated;touch-action:pan-y}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:2rem;max-width:34rem}
.facts dt{font-family:var(--mono);font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.facts dd{font-size:.88rem;color:var(--ink3);margin-top:.25rem}

.mod{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:clamp(.6rem,2.5vw,2rem);padding-block:1.2rem;border-top:1.5px solid var(--ink);align-items:start}
.mod h3{font-size:1.4rem}
.mod h3 small{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;font-weight:400;color:var(--ink3);margin-bottom:.2rem}
.les{display:grid;min-width:0}
.les a{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) 3.8rem;gap:.2rem 1.2rem;min-height:44px;padding-block:.6rem;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;align-items:baseline;transition:color .2s}
.les a:first-child{border-top:0;padding-top:.15rem}
.les b{font-weight:600;font-size:1rem;line-height:1.5}
.les a.pj b{font-weight:800;color:var(--acct)}
.les a:hover b{color:var(--acct);text-decoration:underline;text-underline-offset:.2em}
.les .goal{font-size:.94rem;line-height:1.6;color:var(--ink2)}
.les .goal em{font-style:normal;font-size:.82rem;color:var(--ink3);white-space:nowrap}
.les .min{font-family:var(--mono);font-size:.76rem;color:var(--ink3);text-align:right;white-space:nowrap}

.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.seg button{min-height:40px;padding-inline:1.05rem;border-radius:999px;font-size:.92rem;font-weight:600;white-space:nowrap;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.score{font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums}
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.lt{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:1.05rem;display:flex;flex-direction:column;gap:.85rem;min-width:0}
.lt .q{font-weight:700;font-size:1.05rem;line-height:1.45;flex:1}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.opts button{min-height:64px;padding:.45rem .15rem;border:1.5px solid var(--line);border-radius:5px;display:flex;flex-direction:column;gap:.3rem;align-items:center;justify-content:center;font-size:.8rem;line-height:1.2;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.opts button:hover:not([disabled]){border-color:var(--ink);transform:translateY(-2px)}
.opts button[disabled]{cursor:default;color:var(--ink3)}
.opts button.right{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opts button.right.no{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.opts button.wrong{border-color:var(--acc);color:var(--acct);border-style:dashed}
.ic{width:1.05rem;height:1.05rem;display:block}
.why{font-size:.9rem;color:var(--ink2);line-height:1.6;animation:sw .4s var(--ease)}
.why b{color:var(--ink)}
@keyframes sw{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}
.srcs{margin-top:1.1rem;font-size:.82rem;color:var(--ink3)}
footer{border-top:1px solid var(--line);padding-block:1.4rem;font-size:.82rem;color:var(--ink3)}

@media (max-width:900px){
 .mod{grid-template-columns:minmax(0,1fr)}
 .lights{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
 html{font-size:17px}
 .brand span{display:none}
 .hero .wrap{grid-template-columns:minmax(0,1fr)}
 .hero canvas{max-width:230px;grid-row:1}
 .facts dd{font-size:.8rem}
 .lights{grid-template-columns:minmax(0,1fr)}
 .les a{grid-template-columns:minmax(0,1fr) auto}
 .les .goal{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* 圆窗：逐像素算球面光照，再用 8x8 Bayer 抖动成两色 */
const BAY=[0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21].map(v=>(v+.5)/64);
function rgb(n){const v=getComputedStyle(document.documentElement).getPropertyValue(n).trim().replace('#','');return[0,2,4].map(i=>parseInt(v.slice(i,i+2),16))}
function orb(cv,lx,ly){
 const n=cv.width,c=cv.getContext('2d'),im=c.createImageData(n,n),d=im.data,ink=rgb('--ink'),pap=rgb('--paper'),r=n/2-.5;
 const l=Math.hypot(lx,ly,.8),Lx=lx/l,Ly=ly/l,Lz=.8/l;
 for(let y=0,i=0;y<n;y++)for(let x=0;x<n;x++,i+=4){
  const X=(x-r)/r,Y=(y-r)/r,q=X*X+Y*Y;
  if(q>1){d[i+3]=0;continue}
  const Z=Math.sqrt(1-q);let v=Math.max(0,X*Lx+Y*Ly+Z*Lz);v=v*v*.95+.03;
  const col=v>BAY[(y&7)*8+(x&7)]?pap:ink;
  d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;
 }
 c.putImageData(im,0,0);
}
const big=$('#orb');
big.width=big.height=200;
let lx=-.5,ly=-.55,tx=-.5,ty=-.55,touched=0;
const t0=performance.now();
function tick(now){
 if(!touched){tx=-.5+Math.sin((now-t0)/2600)*.28;ty=-.55+Math.cos((now-t0)/3400)*.2}
 lx+=(tx-lx)*.14;ly+=(ty-ly)*.14;
 if(big.getBoundingClientRect().bottom>0)orb(big,lx,ly);
 setTimeout(()=>requestAnimationFrame(tick),60);
}
addEventListener('pointermove',e=>{const b=big.getBoundingClientRect();touched=1;tx=Math.max(-1.3,Math.min(1.3,(e.clientX-b.left-b.width/2)/(b.width/2)));ty=Math.max(-1.3,Math.min(1.3,(e.clientY-b.top-b.height/2)/(b.height/2)))},{passive:true});

  });

  el.innerHTML=h;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{m[i]=b.dataset.k;lights()});
  box.append(el);
 });
 const n=Object.keys(m).length,ok=a.q.filter((q,i)=>m[i]===q[1]).length;
 $('#score').textContent=n?'猜对 '+ok+' / 已答 '+n:'共 '+a.q.length+' 题';
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{who=b.dataset.w;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));lights()});

orb(big,lx,ly);
